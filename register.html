<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportField - Daftar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0b63d6",
              primaryDark: "#094ea8",
              softGray: "#f6f8fb",
              accent: "#ffb500",
            },
            boxShadow: {
              lift: "0 18px 40px rgba(11,26,54,0.10)",
              soft: "0 8px 24px rgba(11,26,54,0.06)",
            },
            borderRadius: {
              xlcard: "14px",
            },
          },
        },
      };
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #f6f8fb 0%, #e3edff 100%);
        min-height: 100vh;
      }
      .font-poppins {
        font-family: "Poppins", sans-serif;
      }
      .btn-primary {
        background: #0b63d6;
        color: white;
        padding: 12px 24px;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: #094ea8;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(11, 99, 214, 0.3);
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen p-4 py-8">
    <div class="w-full max-w-2xl">
      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-3 mb-6">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-primary to-primaryDark flex items-center justify-center text-white shadow-lg">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="white" />
            </svg>
          </div>
          <div>
            <div class="font-poppins font-semibold text-2xl text-gray-900">SportField</div>
            <div class="text-sm text-gray-500 -mt-0.5">Booking Lapangan</div>
          </div>
        </a>
      </div>

      <!-- Register Card -->
      <div class="bg-white rounded-2xl shadow-lift p-8">
        <div class="text-center mb-8">
          <h1 class="font-poppins font-bold text-2xl text-gray-900 mb-2">Daftar Akun Baru</h1>
          <p class="text-gray-600">Bergabunglah dengan SportField untuk mulai booking lapangan favorit Anda.</p>
        </div>

        <form id="registerForm">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                placeholder="Masukkan nama lengkap"
                required
              />
            </div>
            <div>
              <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Nomor HP</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                placeholder="Masukkan nomor HP"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
              placeholder="Masukkan email Anda"
              required
            />
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label for="job" class="block text-sm font-medium text-gray-700 mb-2">Pekerjaan</label>
              <select id="job" name="job" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200" required>
                <option value="">Pilih pekerjaan</option>
                <option value="pelajar">Pelajar/Mahasiswa</option>
                <option value="karyawan">Karyawan</option>
                <option value="wiraswasta">Wiraswasta</option>
                <option value="profesional">Profesional</option>
                <option value="lainnya">Lainnya</option>
              </select>
            </div>
            <div>
              <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                placeholder="Buat password"
                required
              />
            </div>
          </div>

          <div class="mb-6">
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Konfirmasi Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
              placeholder="Ulangi password"
              required
            />
          </div>

          <div class="mb-4">
            <label for="address" class="block text-sm font-medium text-gray-700 mb-2">Alamat</label>
            <textarea
              id="address"
              name="address"
              rows="3"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
              placeholder="Masukkan alamat lengkap"
              required
            ></textarea>
          </div>

          <button type="submit" class="w-full btn-primary">Daftar</button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-gray-200">
          <p class="text-gray-600">
            Sudah punya akun?
            <a href="login.html" class="text-primary font-semibold hover:text-primaryDark transition-colors">Masuk di sini</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const registerForm = document.getElementById("registerForm");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");

        // Password validation
        function validatePassword() {
          if (passwordInput.value && confirmPasswordInput.value) {
            if (passwordInput.value !== confirmPasswordInput.value) {
              confirmPasswordInput.style.borderColor = "#ef4444";
            } else {
              confirmPasswordInput.style.borderColor = "#10b981";
            }
          }
        }

        if (passwordInput && confirmPasswordInput) {
          passwordInput.addEventListener("input", validatePassword);
          confirmPasswordInput.addEventListener("input", validatePassword);
        }

        // Form submission
        if (registerForm) {
          registerForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const fullName = document.getElementById("fullName").value;
            const phone = document.getElementById("phone").value;
            const email = document.getElementById("email").value;
            const job = document.getElementById("job").value;
            const address = document.getElementById("address").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // Validation
            if (!fullName || !phone || !email || !job || !address || !password || !confirmPassword) {
              alert("Harap isi semua field!");
              return;
            }

            if (password !== confirmPassword) {
              alert("Password dan konfirmasi password tidak cocok!");
              return;
            }

            if (password.length < 6) {
              alert("Password harus minimal 6 karakter!");
              return;
            }

            // Simulasi pendaftaran berhasil
            alert("Pendaftaran berhasil! Silakan login.");
            window.location.href = "login.html";
          });
        }
      });
    </script>
  </body>
</html>
